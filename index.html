function fcText(str,x,y,idx,scale,align){
  scale=scale||1; str=String(str).toUpperCase();
  const w=str.length*8*scale;
  const bx=(align==="center")?Math.round(x-w/2):Math.round(x);
  const by=Math.round(y-4*scale);
  for(let c=0;c<str.length;c++){
    const g=FONT8[str[c]]; if(!g) continue;
    const cx=bx+c*8*scale;
    for(let r=0;r<8;r++){
      const row=g[r]; if(!row) continue;
      for(let b=0;b<8;b++) if(row&(0x80>>b)){
        if(scale===1) px(cx+b,by+r,idx);
        else rect(cx+b*scale,by+r*scale,scale,scale,idx);
      }
    }
  }
  return w;
}
const off=document.createElement("canvas"); off.width=300; off.height=24;
const octx=off.getContext("2d",{willReadFrequently:true});
function text(str,x,y,size,idx,align){
  if(/^[0-9A-Z \-=/:!&\.]+$/i.test(str)){
    const sc = size>=20 ? 2 : 1;
    return fcText(str,x,y,idx,sc,align);
  }
  octx.clearRect(0,0,off.width,off.height);
  octx.font="bold "+size+"px \"MS Sans Serif\",Tahoma,Verdana,sans-serif";
  octx.textBaseline="middle";
  const w=Math.ceil(octx.measureText(str).width);
  octx.fillStyle="#fff"; octx.fillText(str,2,off.height/2);
  const bx=(align==="center")?Math.round(x-w/2):Math.round(x);
  const d=octx.getImageData(0,0,off.width,off.height).data;
  for(let j=0;j<off.height;j++) for(let i=0;i<off.width;i++)
    if(d[(j*off.width+i)*4+3]>96) px(bx+i-2, y+j-12, idx);
  return w;
}

function drawAscii(rows, x, y, flip, pal){
  const h=rows.length, w=rows[0].length;
  for(let r=0;r<h;r++){
    const s=rows[r], py=y+r; if(py<0||py>=H) continue;
    for(let c=0;c<w;c++){
      const ch=s[c]; if(ch===".") continue;
      const col=pal[ch]; if(col===undefined) continue;
      const px0 = flip ? (x+w-1-c) : (x+c);
      if(px0>=0&&px0<W) fb[py*W+px0]=col;
    }
  }
}

/* 肩扛火箭筒点阵 (复刻截图 2 主角肩扛金黄长筒 RPG) */
const RPG_OVERLAY=[
  "..DDDDDDDDDDDDDDDDDDDD..",
  ".DYYYYRRRRYYYYYYYYYYWWD.",
  ".DGGGGDDDDGGGGGGGGGGWWD.",
  "..DDDD....DDDDDDDDDDDD.."
];

function drawMan(x,y,face,col,st){
  st=st||{}; const flip=(face<0);
  const isSnake=!!col.snake;
  const pal={
    D:K.BLACK,
    H:isSnake?K.CRIMSON:(col.f||K.SKIN0),
    M:isSnake?K.BROWN0:K.BLACK,
    B:col.h||K.GREEN1,
    C:col.h2||col.h||K.GREEN2,
    S:col.f||K.SKIN0,
    F:col.f2||K.SKIN1,
    U:col.u||K.GREEN1,
    L:col.u2||K.GREEN0,
    G:col.belt||K.BROWN0,
    K:col.knee||K.GRAY1,
    W:K.WHITE,
    A:K.GRAY4,
    Y:K.GOLD1,
    R:K.RED1
  };
  if(st.dead){
    drawAscii(DEAD_BODY, x-4, y+34, flip, pal);
    return;
  }
  if(st.prone){
    const pr = isSnake ? (st.knife ? PRONE_SNAKE_KNIFE : PRONE_SNAKE) : PRONE_BODY;
    /* 12行匍匐精灵绘制在 y+28，底边正好落在 y+39 贴紧地面! */
    drawAscii(pr, flip?x-6:x-4, y+28, flip, pal);
    if(isSnake && st.knife){
      /* 趴下刺刀向外延伸的闪亮刀锋 */
      const kx = flip ? (x-12) : (x+26);
      rect(kx, y+36, 7, 3, K.BLACK);
      rect(kx+(flip?1:0), y+37, 6, 1, K.WHITE);
    }
    return;
  }
  const leg=st.leg||0;
  const bob=(!st.climb && !st.air && (leg===1||leg===3)) ? 1 : 0;
  /* 黄金 4 头身纵向锚点：头 8px (y+9..16), 躯干 11px (y+16..26), 长腿 13px (y+27..39) */
  const hy=y+9+bob, ty=y+16+bob, ly=y+27;

  if(st.climb){
    const c1=(leg&1)===0;
    drawAscii(HEAD_BACK, x+2, y+9, false, pal);
    drawAscii(c1?TORSO_CLIMB1:TORSO_CLIMB2, x+1, y+16, false, pal);
    drawAscii(c1?LEGS_CLIMB1:LEGS_CLIMB2, x+1, y+27, false, pal);
    return;
  }

  /* 1. 修长腿部 (13行，底边恒定 y+39 踩地) */
  let legs=LEGS_IDLE;
  if(st.air) legs=LEGS_JUMP;
  else if(st.knife) legs=LEGS_KNIFE;
  else if(leg===1) legs=LEGS_RUN1;
  else if(leg===2) legs=LEGS_RUN2;
  else if(leg===3) legs=LEGS_RUN3;
  drawAscii(legs, flip?x-2:x, ly, flip, pal);

  /* 2. 躯干与手臂/匕首 */
  let torso=TORSO_IDLE;
  if(st.knife) torso=TORSO_KNIFE;
  else if(leg===1||leg===3) torso=(leg===1)?TORSO_RUN1:TORSO_RUN2;
  drawAscii(torso, flip?x-2:x, ty, flip, pal);

  /* 3. 精悍头部 (8x8 比例) */
  const head = isSnake ? (((leg===1||leg===3)||st.air)?HEAD_SNAKE_2:HEAD_SNAKE_1) : HEAD_ENEMY;
  drawAscii(head, flip?x+1:x+3, hy, flip, pal);

  /* 4. 毒蛇肩扛火箭筒 (POW > 0 时扛在肩上 y+15，绝不遮挡脸部!) */
  if(st.hasRpg && !st.knife){
    drawAscii(RPG_OVERLAY, x-1, ty, flip, pal);
  }

  /* 5. 敌兵斜背白色步枪细节 */
  if(col.rifle && !st.knife){
    const rx = flip ? (x+15) : (x+3);
    rect(rx, ty-4, 3, 12, K.BLACK);
    rect(rx+1, ty-3, 1, 7, K.WHITE);
    px(rx+1, ty+5, K.BROWN2);
  }
}

/* 5. 音频 */
let actx=null;
function ensureAudio(){
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx&&actx.state==="suspended"&&actx.resume) actx.resume().catch(function(){});
  }catch(e){ actx=null; }
}
function tone(f,d,type,v,to){
  if(!actx) return; const t0=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(f,t0);
  if(to) o.frequency.exponentialRampToValueAtTime(Math.max(30,to),t0+d);
  g.gain.setValueAtTime(v||0.06,t0); g.gain.exponentialRampToValueAtTime(0.0008,t0+d);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+d+0.02);
}
function noise(d,v){
  if(!actx) return; const n=Math.floor(actx.sampleRate*d);
  const b=actx.createBuffer(1,n,actx.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=actx.createBufferSource(); s.buffer=b;
  const g=actx.createGain(); g.gain.value=v||0.08;
  s.connect(g); g.connect(actx.destination); s.start();
}
const SFX={ knife:()=>tone(880,0.05,"square",0.04,320),
  hit:()=>{ tone(140,0.08,"square",0.07,60); noise(0.06,0.05); },
  boom:()=>{ noise(0.32,0.16); tone(100,0.25,"sawtooth",0.09,35); },
  rpg:()=>{ noise(0.18,0.12); tone(320,0.18,"sawtooth",0.07,70); },
  siren:()=>{ tone(520,0.18,"square",0.04,880); setTimeout(()=>tone(880,0.22,"square",0.04,480),190); },
  pick:()=>{ tone(660,0.06,"square",0.05); setTimeout(()=>tone(990,0.08,"square",0.05),60); },
  jump:()=>tone(420,0.07,"square",0.035,700),
  die:()=>tone(300,0.5,"sawtooth",0.09,60),
  shoot:()=>{ tone(220,0.1,"sawtooth",0.05,90); noise(0.08,0.04); },
  rescue:()=>{ tone(520,0.07,"square",0.05); setTimeout(()=>tone(780,0.1,"square",0.05),70); },
};

/* 10. 物理 */
function overlap(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function tileAt(tx,ty){ if(tx<0||tx>=world.mapW) return "#"; if(ty<0||ty>=world.mapH) return "."; return world.map[ty][tx]; }
function solidChar(ch){ return ch==="#"||ch==="B"||ch==="C"; }
function hitsSolid(e,falling,prevBottom){
  const x0=Math.floor(e.x/TILE), x1=Math.floor((e.x+e.w-0.01)/TILE);
  const y0=Math.floor(e.y/TILE), y1=Math.floor((e.y+e.h-0.01)/TILE);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const ch=tileAt(tx,ty);
    /* 梯子顶端 (上方不是梯子) 在非攀爬状态下作为单向桥面支撑，防止在梯子口趴下或走过时掉下去 */
    if(ch==="H" && tileAt(tx,ty-1)!=="H" && !e.climbing && falling && prevBottom <= ty*TILE+4) return true;
    if(!solidChar(ch)) continue;
    /* 高架桥支持从下方跳上或爬梯穿透 */
    if(ty<12 && ch==="#" && (!falling || prevBottom > ty*TILE+4)) continue;
    return true;
  }
  return false;
}
function moveX(e,dx){ if(!dx) return; e.x+=dx;
  const x0=Math.floor(e.x/TILE), x1=Math.floor((e.x+e.w-0.01)/TILE);
  const y0=Math.floor((e.y+8)/TILE), y1=Math.floor((e.y+e.h-0.01)/TILE);
  let hit=false;
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const ch=tileAt(tx,ty);
    if(ch==="B"||ch==="C"||(ty>=12&&ch==="#")) hit=true;
  }
  if(hit){
    if(dx>0) e.x=Math.floor((e.x+e.w)/TILE)*TILE-e.w-0.01;
    else e.x=(Math.floor(e.x/TILE)+1)*TILE+0.01;
    e.vx=0; }
}
function moveY(e,dy){ if(!dy) return; const pb=e.y+e.h; e.y+=dy;
  if(hitsSolid(e,dy>0,pb)){
    if(dy>0){ e.y=Math.floor((e.y+e.h)/TILE)*TILE-e.h-0.01; e.onGround=true; }
    else { e.y=(Math.floor(e.y/TILE)+1)*TILE+0.01; }
    e.vy=0; }
}
function ladderAt(e){
  const cx=Math.floor((e.x+e.w/2)/TILE);
  const y0=Math.floor((e.y+6)/TILE), y1=Math.floor((e.y+e.h+2)/TILE);
  for(let ty=y0;ty<=y1;ty++) if(tileAt(cx,ty)==="H") return true;
  return false;
}
function ladderAtBelow(e){ return tileAt(Math.floor((e.x+e.w/2)/TILE),Math.floor((e.y+e.h+2)/TILE))==="H"; }
function inWater(e){ return tileAt(Math.floor((e.x+e.w/2)/TILE),Math.floor((e.y+e.h-1)/TILE))==="~"; }
function checkMine(e){
  const tx=Math.floor((e.x+e.w/2)/TILE), ty=Math.floor((e.y+e.h-2)/TILE);
  if(tileAt(tx,ty)==="^"){
    world.map[ty][tx]=".";
    spawnExplosion(tx*TILE+8, ty*TILE+12, true);
    hurtPlayer(-e.face);
  }
}

/* 11. 实体与战斗逻辑 */
function spawnExplosion(x,y,big){
  SFX.boom();
  world.fx.shake=big?12:6;
  const cnt=big?14:6;
  for(let i=0;i<cnt;i++){
    const a=(Math.PI*2*i)/cnt;
    world.parts.push({x:x,y:y,vx:Math.cos(a)*(big?2.2:1.2),vy:Math.sin(a)*(big?2.2:1.2)-0.6,life:big?18:10,big:big});
  }
}

function fireRocket(p){
  p.pow--; p.shootCool=22; p.attack=12;
  SFX.rpg();
  const ry = p.prone ? p.y+28 : p.y+15;
  const rx = p.face>0 ? p.x+16 : p.x-10;
  world.bullets.push({x:rx,y:ry,vx:p.face*TUNE.bullet,owner:"player",rocket:true,life:180,w:10,h:4});
  world.fx.shake=4;
}

function updatePlayer(p){
  if(!p.alive) return;
  if(p.invuln>0) p.invuln--;
  if(p.attack>0) p.attack--;
  if(p.shootCool>0) p.shootCool--;
  let ax=0; if(held("left")) ax-=1; if(held("right")) ax+=1;
  if(ax!==0) p.face=ax;

  /* 开局高空跳伞空降演出：缓缓飘落，落地瞬间抛弃降落伞并进入战斗! */
  if(p.para){
    p.vx = ax * 0.8 + Math.sin(world.tick * 0.09) * 0.35;
    p.vy = 1.35;
    moveX(p, p.vx);
    p.onGround = false;
    moveY(p, p.vy);
    if(p.onGround){
      p.para = false;
      SFX.jump();
      /* 落地抛出的降落伞随风向左上飘走 */
      world.chutes.push({x:p.x, y:p.y, vx:-0.9, vy:-1.1, life:55});
    }
    return;
  }

  const onLad=ladderAt(p);
  if(!p.climbing && onLad && (held("up") || (held("down") && ladderAtBelow(p)))){
    p.climbing=true; p.prone=false; p.vy=0; p.vx=0;
  }
  if(p.climbing){
    const cx=(Math.floor((p.x+p.w/2)/TILE)+0.5)*TILE;
    p.x += (cx-(p.x+p.w/2))*0.3;
    p.vx=0;
    p.vy = held("up")? -TUNE.climb : (held("down")? TUNE.climb : 0);
    p.y += p.vy;
    if(p.y<0) p.y=0;
    if(!ladderAt(p)){
      p.climbing=false;
      if(p.vy<0){ p.y=Math.round((p.y+p.h)/TILE)*TILE-p.h-0.01; p.onGround=true; p.vy=0; }
    }
    if(held("down") && p.onGround && !ladderAtBelow(p)){ p.climbing=false; }
    if(p.vy!==0){ p.animT++; if(p.animT%8===0) p.leg=(p.leg+1)&1; }
    if(pressed("jump") && ax!==0){ p.climbing=false; p.vy=TUNE.jump*0.75; }
    if(pressed("attack")&&p.attack<=0){ p.attack=TUNE.atkTotal; p.hitSet=new Set(); SFX.knife(); }
    return;
  }

  p.prone = p.onGround && held("down") && !ladderAtBelow(p);
  const sp = p.prone ? 0 : (p.attack>0 ? TUNE.speed*0.35 : TUNE.speed);
  if(p.knock>0){ p.knock--; p.vx=p.knockDir*3*(p.knock/8); }
  else p.vx=ax*sp;

  if(pressed("jump")&&p.onGround){ p.prone=false; p.vy=TUNE.jump; p.onGround=false; SFX.jump(); }

  /* 攻击：按住 ↑ + J 发射肩扛火箭筒；平时按 J 为 CQC 刺刀 */
  if(pressed("attack")&&p.attack<=0){
    if(p.pow>0 && p.shootCool<=0 && held("up") && !onLad){
      fireRocket(p);
      p.hitSet=new Set();
    } else {
      p.attack=TUNE.atkTotal; p.hitSet=new Set(); SFX.knife();
    }
  }

  p.vy=Math.min(p.vy+TUNE.gravity,TUNE.maxFall);
  moveX(p,p.vx);
  p.onGround=false;
  moveY(p,p.vy);
  if(p.vx!==0&&p.onGround){ p.animT++; if(p.animT%5===0) p.leg=(p.leg+1)&3; } else if(p.onGround) p.leg=0;

  if(p.attack<=TUNE.atkFrom && p.attack>=TUNE.atkTo && p.hitSet){
    const ky = p.prone ? p.y+28 : p.y+14;
    const kr = p.face>0? {x:p.x+10,y:ky,w:24,h:14} : {x:p.x-20,y:ky,w:24,h:14};
    for(const e of world.enemies){
      if(!e.alive||p.hitSet.has(e.id)) continue;
      if(overlap(kr,e)){ p.hitSet.add(e.id); damageEnemy(e,1,p.face);
        world.fx.flash=0.35; world.fx.flashColor=[255,255,255]; flashT=2; SFX.hit(); }
    }
    const tx=Math.floor((p.face>0?p.x+20:p.x-8)/TILE), ty=Math.floor((p.prone?p.y+35:p.y+20)/TILE);
    const tch=tileAt(tx,ty);
    if(tch==="C"||(p.prone&&tch==="^")){
      world.map[ty][tx]="."; world.score+=100;
      if(tch==="C") world.items.push({x:tx*TILE+2,y:ty*TILE+4,w:12,h:10});
      spawnExplosion(tx*TILE+8,ty*TILE+8,false);
    }
    for(const w of world.pows){
      if(w.tied && overlap({x:w.x-6,y:w.y-6,w:22,h:44}, kr)){ w.tied=false; world.score+=500; world.rescued++; SFX.rescue(); }
    }
  }
  if(inWater(p)) killPlayer();
  checkMine(p);
}

function spawnEnemy(kind,x,y){
  world.enemies.push({id:Math.random(),kind:kind,x:x,y:y,w:14,h:40,vx:0,vy:0,onGround:false,
    face:-1,alive:true,hp:kind==="prone"?2:1,hitFlash:0,attack:0,prone:false,cool:30+((Math.random()*40)|0),
    animT:0,leg:0,deadT:0,fireT:0,alertT:24});
}
function updateEnemies(){
  const p=world.player;
  for(const e of world.enemies){
    if(e.hitFlash>0) e.hitFlash--;
    if(e.alertT>0) e.alertT--;
    if(!e.alive){ e.deadT++; continue; }
    const dx=(p.x-e.x); e.face=dx<0?-1:1;
    const ad=Math.abs(dx);
    if(e.kind==="rush"||e.kind==="carrier"){
      e.prone=false;
      if(ad>18 && !e.attack) e.vx=e.face*TUNE.rush; else e.vx=0;
      if(ad<24 && e.cool<=0 && !e.attack){ e.attack=18; e.cool=90; }
      if(e.cool>0) e.cool--;
      if(e.attack>0){ e.attack--; if(e.attack===8) meleePlayer(e); }
    } else {
      if(e.fireT>0){
        e.fireT--; e.vx=0; e.prone=true;
        if(e.fireT%26===0){
          spawnBullet(e.face>0?e.x+18:e.x-6, e.y+29, e.face*TUNE.ebullet, "enemy");
          tone(240,0.05,"sawtooth",0.04,140);
        }
        if(e.fireT===0) e.prone=false;
      } else {
        e.prone=false;
        if(ad>110) e.vx=e.face*TUNE.prone; else if(ad<70) e.vx=-e.face*TUNE.prone; else e.vx=0;
        if(e.cool>0) e.cool--;
        if(e.cool<=0 && ad<160){ e.cool=140; e.fireT=78; }
      }
    }
    const aheadX=e.x+(e.face>0?e.w+4:-4);
    const below=tileAt(Math.floor(aheadX/TILE),Math.floor((e.y+e.h+4)/TILE));
    if(e.onGround&&(below==="."||below==="~")) e.vx=0;
    e.vy=Math.min(e.vy+TUNE.gravity,TUNE.maxFall);
    moveX(e,e.vx);
    e.onGround=false;
    moveY(e,e.vy);
    if(e.vx!==0){ e.animT++; if(e.animT%7===0) e.leg=(e.leg+1)&3; }
    if(inWater(e)){ e.alive=false; e.deadT=0; }
  }
  world.enemies=world.enemies.filter(e=>e.alive||e.deadT<90);
}
function meleePlayer(e){
  const p=world.player;
  if(!p.alive||p.invuln>0||p.climbing) return;
  const kr=e.face>0?{x:e.x+12,y:e.y+10,w:20,h:22}:{x:e.x-18,y:e.y+10,w:20,h:22};
  if(overlap(kr,p)) hurtPlayer(e.face);
}
function hurtPlayer(dir){
  const p=world.player;
  if(p.invuln>0||!p.alive) return;
  world.lives--;
  if(world.lives<=0){ killPlayer(true); return; }
  p.invuln=TUNE.invuln; p.knock=8; p.knockDir=dir; p.vy=-3; p.climbing=false; p.prone=false;
  world.fx.flash=0.8; world.fx.flashColor=[255,40,40]; flashT=8;
  world.fx.shake=TUNE.shakeTicks; SFX.hit();
}
function killPlayer(noLife){
  const p=world.player;
  if(!p.alive) return;
  p.alive=false; p.climbing=false;
  if(!noLife) world.lives=Math.max(0,world.lives-1);
  world.fx.flash=0.7; world.fx.flashColor=[255,60,60]; flashT=10;
  world.fx.shake=TUNE.shakeTicks; SFX.die(); world.respawn=70;
}
function respawnPlayer(){
  const p=world.player;
  p.alive=true; p.invuln=90; p.attack=0; p.vx=0; p.vy=0; p.climbing=false; p.prone=false;
  p.x=Math.max(28,Math.min(world.cam+44,world.level.pixelWidth-80));
  p.y=GROUND_TOP-p.h;
}
function spawnBullet(x,y,vx,owner){ world.bullets.push({x:x,y:y,vx:vx,owner:owner,rocket:false,life:200,w:5,h:3}); }
function updateBullets(){
  const p=world.player;
  for(const b of world.bullets){
    b.x+=b.vx; b.life--;
    if(b.rocket && (b.life&1)){
      world.parts.push({x:b.vx>0?b.x-2:b.x+10,y:b.y+1,vx:0,vy:-0.3,life:6,big:false});
    }
    const tx=Math.floor((b.x+(b.vx>0?b.w:0))/TILE), ty=Math.floor((b.y+1)/TILE);
    const ch=tileAt(tx,ty);
    if(ch==="B"||ch==="C"||(ty>=12&&ch==="#")){
      b.life=0;
      if(ch==="C"){ world.map[ty][tx]="."; world.score+=100; world.items.push({x:tx*TILE+2,y:ty*TILE+4,w:12,h:10}); }
      spawnExplosion(b.x,b.y,b.rocket);
    }
    if(b.owner==="player"){
      for(const e of world.enemies){
        if(e.alive&&overlap(b,e)){
          b.life=0; damageEnemy(e,b.rocket?5:2,Math.sign(b.vx));
          if(b.rocket) spawnExplosion(b.x,b.y,true);
        }
      }
    } else if(p.alive&&p.invuln<=0){
      const phit = p.prone ? {x:p.x,y:p.y+28,w:p.w,h:12} : p;
      if(overlap(b,phit)){ b.life=0; hurtPlayer(Math.sign(b.vx)); }
    }
  }
  world.bullets=world.bullets.filter(b=>b.life>0);
}
function damageEnemy(e,dmg,dir){
  e.hp-=dmg; e.hitFlash=6; e.vx=dir*1.6;
  if(e.hp<=0&&e.alive){
    e.alive=false; e.deadT=0; world.score+=(e.kind==="prone"?300:200);
    if(e.kind==="carrier"){
      world.items.push({x:e.x, y:e.y+28, w:12, h:10});
    }
  }
}
function updateItems(){
  const p=world.player;
  for(const it of world.items){
    if(p.alive && overlap(p,it)){
      it.picked=true; p.pow=Math.min(9, p.pow+3); world.score+=300; SFX.pick();
    }
  }
  world.items=world.items.filter(it=>!it.picked);
}
function updateWaves(){
  const pxr=world.player.x;
  world.level.waves.forEach((w,i)=>{
    if(world.spawned[i]||pxr<=w.at) return;
    world.spawned[i]=true;
    for(const s of w.spawn) spawnEnemy(s[0],s[1], s[2]==="d"?DECK_TOP-40:GROUND_TOP-40);
    tone(180,0.1,"square",0.04,120);
  });
}
function updateCamera(){
  const p=world.player;
  const target=Math.max(0,Math.min(p.x-84,world.level.pixelWidth-W));
  world.cam+=(target-world.cam)*0.18;
}
function updateFx(){
  if(flashT>0){ flashT--; if(!flashT) world.fx.flash=0; }
  else if(world.fx.flash>0){ world.fx.flash*=0.8; if(world.fx.flash<0.02) world.fx.flash=0; }
  if(world.fx.shake>0) world.fx.shake--;
  for(const pt of world.parts){ pt.x+=(pt.vx||0); pt.y+=(pt.vy||0); pt.life--; }
  world.parts=world.parts.filter(pt=>pt.life>0);
  for(const ch of world.chutes){ ch.x+=ch.vx; ch.y+=ch.vy; ch.life--; }
  world.chutes=world.chutes.filter(ch=>ch.life>0);
}
function freePows(){
  const p=world.player;
  if(!p.alive) return;
  for(const pw of world.pows){
    if(!pw.tied) continue;
    if(overlap({x:pw.x-2,y:pw.y+2,w:20,h:38}, p)){ pw.tied=false; world.score+=500; world.rescued++; SFX.rescue(); }
  }
}

/* 12. 场景步进 */
function stepPlay(){
  world.tick++;
  if(world.fx.bright<1) world.fx.bright=Math.min(1,world.fx.bright+1/36);
  updatePlayer(world.player);
  if(world.player.alive){ updateWaves(); freePows(); }
  updateEnemies(); updateBullets(); updateItems(); updateCamera(); updateFx();
  if(!world.player.alive){
    world.respawn--;
    if(world.respawn<=0){
      if(world.lives<=0){ state="gameover"; sceneT=0; best=Math.max(best,world.score); }
      else respawnPlayer();
    }
  }
  if(world.player.x>world.level.pixelWidth-36){
    state="clear"; sceneT=0; best=Math.max(best,world.score);
  }
}

/* 13. FC 多段叙事背景与前景奇观渲染 (复刻截图 1 铁桥坦克段 + 截图 2 雪山核弹&萨姆导弹基地段) */
function drawMountainPeak(peakX, peakY, baseW, cam){
  const sx=Math.round(peakX - cam*0.65);
  const baseY=GROUND_TOP;
  const h=baseY-peakY;
  for(let dy=0;dy<h;dy++){
    const py=peakY+dy; if(py<24||py>=GROUND_TOP) continue;
    const halfW=Math.floor((dy/h)*(baseW/2));
    const x0=Math.max(0, sx-halfW), x1=Math.min(W, sx+halfW);
    for(let x=x0;x<x1;x++){
      const distEdge = (sx+halfW) - x;
      const snowLine = 26 + ((x*7)&7);
      if(dy < snowLine || distEdge < 10 + ((dy>>2)&3)){
        fb[py*W+x] = ((x+py)&1) ? K.WHITE : (dy<snowLine-6 ? K.WHITE : K.GRAY2);
      } else {
        fb[py*W+x] = K.GRAY2;
      }
    }
  }
}

/* 桥下绿色像素坦克 (复刻截图 1 桥下隧道坦克) */
function drawTank(wx, gy, cam){
  const sx=Math.round(wx-cam);
  if(sx<-48||sx>W+16) return;
  rect(sx+10, gy-22, 18, 7, K.GREEN1);
  rect(sx+12, gy-21, 14, 2, K.GREEN2);
  rect(sx+26, gy-20, 14, 3, K.GREEN2);
  rect(sx+2, gy-15, 34, 8, K.GREEN0);
  rect(sx+4, gy-14, 30, 3, K.GREEN1);
  rect(sx, gy-7, 38, 7, K.BLACK);
  rect(sx+2, gy-6, 34, 5, K.GREEN0);
  for(let i=4;i<34;i+=6) rect(sx+i, gy-5, 4, 3, K.GRAY2);
}

/* 截图 2 静态背景：两侧 3 联装黑白防空导弹排架 + 中央巨型透视萨姆导弹 (SAM / ICBM) + 白色双层指挥楼 */
function drawTripleRack(sx, gy, count){
  for(let i=0;i<count;i++){
    const mx=sx+i*5;
    // 黑尖头
    rect(mx+1, gy-34, 3, 4, K.BLACK);
    // 白弹身+灰竖纹
    rect(mx, gy-30, 5, 18, K.BLACK);
    rect(mx+1, gy-30, 3, 17, K.WHITE);
    px(mx+3, gy-26, K.GRAY2); px(mx+3, gy-20, K.GRAY2);
    // 黑色发射架底座
    rect(mx, gy-12, 5, 12, K.BLACK);
    rect(mx+1, gy-10, 3, 2, K.WHITE);
    rect(mx+1, gy-5, 3, 4, K.GRAY3);
  }
}

function drawStaticMissileBase(cam){
  const baseWx = 870;
  const sx = Math.round(baseWx - cam);
  if(sx < -160 || sx > W + 160) return;
  const gy = GROUND_TOP;
  const cx = sx; // 巨型萨姆导弹中心 X

  // 1. 两侧远景黑色高塔剪影与三联装防空导弹排架 (严格复刻截图 2 左右两侧建筑群)
  // 左侧建筑群
  rect(sx-110, gy-11, 12, 11, K.BLACK);
  for(let y=gy-9;y<gy-1;y+=3) rect(sx-108, y, 8, 1, K.WHITE);
  drawTripleRack(sx-96, gy, 3);
  rect(sx-76, gy-28, 9, 28, K.BLACK);
  for(let y=gy-25;y<gy-4;y+=4) px(sx-74, y, K.GRAY3);
  drawTripleRack(sx-62, gy, 3);

  // 右侧建筑群
  drawTripleRack(sx+46, gy, 3);
  rect(sx+66, gy-28, 9, 28, K.BLACK);
  for(let y=gy-25;y<gy-4;y+=4) px(sx+68, y, K.GRAY3);
  drawTripleRack(sx+82, gy, 2);
  rect(sx+98, gy-28, 9, 28, K.BLACK);
  for(let y=gy-25;y<gy-4;y+=4) px(sx+100, y, K.GRAY3);
  rect(sx+110, gy-9, 12, 9, K.BLACK);

  // 2. 底部白色双层多孔掩体指挥楼 (复刻截图 2 巨型导弹正下方白楼)
  rect(cx-44, gy-24, 88, 24, K.BLACK);
  rect(cx-42, gy-22, 84, 9, K.WHITE);
  rect(cx-42, gy-11, 84, 9, K.WHITE);
  for(let wx=-38; wx<=34; wx+=10){
    rect(cx+wx, gy-20, 6, 5, K.BLACK);
    rect(cx+wx+1, gy-19, 2, 2, K.GRAY2);
    rect(cx+wx, gy-9, 6, 5, K.BLACK);
    rect(cx+wx+1, gy-8, 2, 2, K.GRAY2);
  }
  // 发射台支架机械结构 (连接白楼与导弹喷口)
  rect(cx-24, gy-34, 48, 10, K.BLACK);
  for(let wx=-20; wx<=16; wx+=8) rect(cx+wx, gy-32, 4, 6, K.WHITE);

  // 3. 中央巨型透视萨姆导弹 (SAM) —— 纯静态巨型背景奇观!
  const topY = 82;
  // (a) 锥形黑色弹体 + 中轴线菱形高光与抖动阴影
  for(let dy=0; dy<76; dy++){
    const py = topY + dy;
    const hw = dy<32 ? (2 + Math.floor(dy*0.28)) : (11 + Math.floor((dy-32)*0.16));
    rect(cx-hw, py, hw*2, 1, K.BLACK);
    if(dy===4 || dy===5) rect(cx-1, py, 2, 1, K.GRAY3);
    if(dy>14 && dy<58){
      const gw = Math.max(1, Math.floor((dy-12)*0.15));
      for(let gx=-gw; gx<=gw; gx++){
        if(Math.abs(gx)<=1 && dy>26 && dy<50) px(cx+gx, py, ((gx+dy)&1)?K.WHITE:K.GRAY4);
        else px(cx+gx, py, ((gx+dy)&1)?K.GRAY3:K.GRAY2);
      }
    }
  }
  // (b) 中部两侧大展弦比灰色梯形弹翼 (带白高光前缘与黑铆钉点，复刻截图 2)
  for(let wy=0; wy<20; wy++){
    const py = topY + 32 + wy;
    const wSpan = wy<11 ? (6 + wy*1.4)|0 : Math.max(3, (21 - (wy-11)*1.8)|0);
    // 左弹翼
    rect(cx-10-wSpan, py, wSpan+2, 1, K.BLACK);
    if(wy>=2 && wy<=17){
      rect(cx-8-wSpan, py, wSpan-1, 1, wy<4 ? K.WHITE : K.GRAY3);
      if(wy===10){ px(cx-14, py, K.BLACK); px(cx-18, py, K.BLACK); px(cx-22, py, K.BLACK); }
    }
    // 右弹翼
    rect(cx+8, py, wSpan+2, 1, K.BLACK);
    if(wy>=2 && wy<=17){
      rect(cx+9, py, wSpan-1, 1, wy<4 ? K.WHITE : K.GRAY3);
      if(wy===10){ px(cx+14, py, K.BLACK); px(cx+18, py, K.BLACK); px(cx+22, py, K.BLACK); }
    }
  }
  // (c) 尾部两侧下垂小尾翼
  for(let fy=0; fy<14; fy++){
    const py = topY + 62 + fy;
    const fw = 6 + (fy>>1);
    rect(cx-16-fw, py, fw, 1, K.BLACK);
    rect(cx-15-fw, py, fw-2, 1, K.GRAY2);
    rect(cx+16, py, fw, 1, K.BLACK);
    rect(cx+17, py, fw-2, 1, K.GRAY2);
  }
  // (d) 底部正对镜头的巨大圆形尾喷口 (外圈黑 + 齿轮刻度环 + 灰色内环 + 纯黑喷管深渊)
  const ny = topY + 64;
  for(let dy=-16; dy<=16; dy++){
    const py = ny + dy;
    const rx = Math.round(Math.sqrt(Math.max(0, 16*16 - dy*dy))*1.12);
    rect(cx-rx-2, py, (rx+2)*2, 1, K.BLACK);
    if(Math.abs(dy)<14){
      const rx2 = Math.round(Math.sqrt(Math.max(0, 14*14 - dy*dy))*1.08);
      for(let x=-rx2; x<=rx2; x++){
        // 喷口外圈齿轮状纹理
        const isRim = Math.abs(x) > rx2-3 || Math.abs(dy) > 11;
        px(cx+x, py, (isRim && ((x+dy)&1)) ? K.BLACK : K.GRAY2);
      }
    }
    if(Math.abs(dy)<10){
      const rx3 = Math.round(Math.sqrt(Math.max(0, 10*10 - dy*dy))*1.05);
      rect(cx-rx3, py, rx3*2, 1, K.BLACK);
    }
  }
}

function drawBackdrop(){
  const cam=Math.round(world.cam)+(world.shakeX||0);
  rect(0, 22, W, GROUND_TOP-22, K.SKY0);

  drawMountainPeak(520, 74, 240, cam);
  drawMountainPeak(680, 48, 320, cam);

  const bStart = 7*TILE - cam, bEnd = 36*TILE - cam;
  const tStart = 18*TILE - cam, tEnd = 31*TILE - cam;
  if(tEnd>0 && tStart<W){
    rect(tStart+20, 56, (tEnd-tStart)-40, 8, K.BLACK);
    rect(tStart+20, 57, (tEnd-tStart)-40, 5, K.BROWN2);
    for(let k=0;k<4;k++){
      const bx = tStart + k*48;
      for(let dy=0;dy<56;dy++){
        const py=56+dy;
        rect(bx+28-(dy>>1), py, 12, 1, K.BLACK);
        rect(bx+30-(dy>>1), py, 8, 1, K.BROWN2);
        rect(bx+24-(dy>>1), py, 4, 1, K.BROWN1);
        rect(bx+28+(dy>>1), py, 12, 1, K.BLACK);
        rect(bx+30+(dy>>1), py, 8, 1, K.BROWN2);
        rect(bx+38+(dy>>1), py, 4, 1, K.BROWN1);
      }
    }
  }

  if(bEnd>0 && bStart<W){
    const x0=Math.max(0, bStart+32), x1=Math.min(W, bEnd);
    if(x1>x0){
      rect(x0, DECK_TOP+16, x1-x0, GROUND_TOP-(DECK_TOP+16), K.BLACK);
      for(let wx=10*TILE; wx<35*TILE; wx+=32){
        const sx=wx-cam; if(sx<-32||sx>W) continue;
        rect(sx+4, DECK_TOP+18, 24, 46, K.GRAY2);
        for(let j=0;j<10;j++) rect(sx+6+j, DECK_TOP+18+j*2, 20-j*2, 2, K.WHITE);
        for(let w=0;w<24;w+=6){
          px(sx+w, GROUND_TOP-7, K.WHITE); px(sx+w+2, GROUND_TOP-5, K.WHITE);
          px(sx+w+4, GROUND_TOP-3, K.WHITE); px(sx+w, GROUND_TOP-3, K.WHITE);
          px(sx+w+4, GROUND_TOP-7, K.WHITE);
        }
      }
      drawTank(16*TILE, GROUND_TOP, cam);
      drawTank(25*TILE, GROUND_TOP, cam);
    }
  }

  drawStaticMissileBase(cam);
}

function drawBrickTile(sx,sy){
  rect(sx,sy,TILE,TILE,K.BLACK);
  for(let row=0;row<2;row++){
    const ry=sy+row*8, off=(row&1)?4:0;
    for(let col=-4;col<16;col+=8){
      const bx=sx+col+off;
      const x0=Math.max(sx,bx), x1=Math.min(sx+TILE,bx+7);
      if(x1>x0){
        rect(x0, ry+1, x1-x0, 6, K.BROWN2);
        rect(x0, ry+1, x1-x0, 1, K.ORANGE);
        px(x0+1, ry+3, K.BLACK);
      }
    }
  }
}

function drawTerrain(){
  const cam=Math.round(world.cam)+(world.shakeX||0);
  const tx0=Math.max(0,Math.floor(cam/TILE)-1), tx1=Math.min(world.mapW-1,Math.ceil((cam+W)/TILE));
  for(let tx=tx0;tx<=tx1;tx++) for(let ty=0;ty<world.mapH;ty++){
    const ch=world.map[ty][tx]; if(ch===".") continue;
    const sx=tx*TILE-cam, sy=ty*TILE;
    if(ch==="B"){
      drawBrickTile(sx,sy);
    } else if(ch==="#"){
      const above=tileAt(tx,ty-1);
      if(ty>=12){
        rect(sx,sy,TILE,TILE,K.GRAY4);
        if(above!=="#"&&above!=="B"){
          rect(sx,sy,TILE,3,K.WHITE);
        }
      } else {
        rect(sx,sy,TILE,TILE,K.BLACK);
        rect(sx,sy,TILE,4,K.BROWN2);
        rect(sx,sy,TILE,1,K.ORANGE);
        for(let r=2;r<16;r+=4) px(sx+r, sy+2, K.BLACK);
        for(let k=0;k<8;k++){
          px(sx+k, sy+4+k, K.BROWN2); px(sx+1+k, sy+4+k, K.BROWN1);
          px(sx+15-k, sy+4+k, K.BROWN2); px(sx+14-k, sy+4+k, K.BROWN1);
        }
        rect(sx,sy+12,TILE,4,K.BROWN2);
        rect(sx,sy+12,TILE,1,K.ORANGE);
      }
    } else if(ch==="H"){
      rect(sx+2,sy,2,TILE,K.BROWN2); rect(sx+12,sy,2,TILE,K.BROWN2);
      px(sx+2,sy,K.WHITE); px(sx+12,sy,K.WHITE);
      rect(sx+3,sy+3,9,2,K.BROWN2); rect(sx+4,sy+3,7,1,K.WHITE);
      rect(sx+3,sy+11,9,2,K.BROWN2); rect(sx+4,sy+11,7,1,K.WHITE);
    } else if(ch==="~"){
      rect(sx,sy,TILE,TILE,K.TEAL0);
      if(tileAt(tx,ty-1)!=="~"){ rect(sx,sy,TILE,2,K.TEAL2); rect(sx,sy+2,TILE,1,K.TEAL1); }
      const ph=(world.tick>>3)&1;
      rect(sx+((ph)?2:6),sy+4,6,1,K.TEAL2);
      rect(sx+((ph)?8:1),sy+11,5,1,K.TEAL1);
    } else if(ch==="C"){
      rect(sx,sy,TILE,TILE,K.BLACK);
      rect(sx+1,sy+1,14,14,K.BROWN1);
      rect(sx+1,sy+1,14,2,K.ORANGE);
      for(let k=0;k<6;k++){ px(sx+2+k,sy+3+k,K.BROWN0); px(sx+13-k,sy+3+k,K.BROWN0); }
    } else if(ch==="^"){
      rect(sx+2, sy+11, 12, 5, K.BLACK);
      rect(sx+3, sy+12, 10, 3, K.GOLD1);
      rect(sx+5, sy+11, 6, 2, ((world.tick>>3)&1)?K.RED1:K.ORANGE);
    }
  }
}

function drawEnemy(e,cam){
  const sx=Math.round(e.x-cam)-4, sy=Math.round(e.y);
  let col;
  if(e.kind==="carrier"){
    col={h:K.GOLD1,h2:K.ORANGE,f:K.SKIN0,f2:K.SKIN1,u:K.RED1,u2:K.RED0,belt:K.WHITE,knee:K.WHITE,rifle:true};
  } else if(e.kind==="prone"){
    col={h:K.BROWN2,h2:K.ORANGE,f:K.SKIN0,f2:K.SKIN1,u:K.GREEN1,u2:K.GREEN0,belt:K.BROWN0,knee:K.GRAY2};
  } else {
    col={h:K.BROWN1,h2:K.BROWN2,f:K.SKIN0,f2:K.SKIN1,u:K.WHITE,u2:K.GRAY3,belt:K.BLACK,knee:K.WHITE,rifle:true};
  }
  drawMan(sx,sy,e.face,col,{prone:e.prone,dead:!e.alive,leg:e.leg,knife:e.attack>0,air:!e.onGround});

  if(e.alive && e.alertT>0){
    rect(sx+9, sy-4, 3, 5, K.RED1);
    px(sx+10, sy+2, K.RED1);
  }
  if(e.hitFlash>0){
    const bx=Math.round(e.x-cam)-4, by=Math.round(e.y);
    for(let j=by;j<by+40;j++) for(let i=bx;i<bx+24;i++){
      if(i<0||i>=W||j<0||j>=H) continue;
      const c=fb[j*W+i];
      if(c!==K.BLACK&&c!==K.SKY0) fb[j*W+i]=K.WHITE;
    }
  }
}

const HUD_KNIFE=[
  ".....WW",
  "....WWG",
  "...WWG.",
  "..GGG..",
  ".BB....",
  "BB....."
];
function drawHUD(){
  rect(0,0,W,22,K.BLACK);
  fcText("1P", 16, 6, K.WHITE, 1);
  fcText(String(world.score), 68, 6, K.WHITE, 1);
  fcText("HI", 108, 6, K.WHITE, 1);
  fcText(String(Math.max(best,world.score)), 148, 6, K.WHITE, 1);
  fcText("POW="+world.player.pow, 84, 15, K.WHITE, 1);
  for(let i=0;i<world.lives;i++){
    drawAscii(HUD_KNIFE, 22+i*8, 13, false, {W:K.WHITE,G:K.GRAY3,B:K.GRAY2});
  }
}

function drawBanner(){
  const t=world.tick;
  if(t>185) return;
  const y=30, h=42;
  if(t>155 && (t&2)) return;
  rect(8,y,W-16,h,K.BLACK);
  rect(8,y,W-16,1,K.GREEN2); rect(8,y+h-1,W-16,1,K.GREEN2);
  rect(8,y,1,h,K.GREEN2); rect(W-9,y,1,h,K.GREEN2);
  /* 无线电 PTT 闪烁指示标 + 打字机式字幕演出 */
  if((t>>3)&1) rect(14, y+4, 26, 9, K.RED1);
  fcText("PTT", 15, y+9, K.WHITE, 1);
  fcText("CODEC 140.85 : STAGE 1", 46, y+9, K.GREEN2, 1);
  const msg1 = "HALO DROP COMPLETE. PROCURE";
  const msg2 = "WEAPONS ON SITE, SNAKE!";
  const n1 = Math.min(msg1.length, Math.floor(t*0.6));
  const n2 = Math.max(0, Math.min(msg2.length, Math.floor((t-36)*0.6)));
  fcText(msg1.slice(0,n1), 16, y+21, K.WHITE, 1);
  if(n2>0) fcText(msg2.slice(0,n2), 16, y+32, K.GOLD1, 1);
}

function drawWorld(){
  world.shakeX = world.fx.shake>0 ? ((world.fx.shake&2)?2:-2) : 0;
  drawBackdrop();
  drawTerrain();
  const cam=Math.round(world.cam)+world.shakeX;

  for(const it of world.items){
    const sx=Math.round(it.x-cam), sy=Math.round(it.y);
    rect(sx, sy, 12, 9, K.BLACK);
    rect(sx+1, sy+1, 10, 7, ((world.tick>>2)&1)?K.GOLD1:K.ORANGE);
    rect(sx+3, sy+3, 6, 3, K.RED1);
  }
  for(const w of world.pows) if(w.x-cam>-30&&w.x-cam<W+30) drawPow(w,cam);
  for(const b of world.bullets){
    const sx=Math.round(b.x-cam), sy=Math.round(b.y);
    if(sx<-12||sx>W+12) continue;
    if(b.rocket){
      rect(sx, sy, 10, 4, K.BLACK);
      rect(sx+1, sy+1, 8, 2, K.GOLD1);
      rect(b.vx>0?sx+7:sx, sy+1, 3, 2, K.RED1);
    } else {
      rect(sx, sy, 4, 2, K.WHITE);
    }
  }
  for(const e of world.enemies){ if(e.x-cam<-40||e.x-cam>W+30) continue; drawEnemy(e,cam); }

  const p=world.player;
  if(p.alive&&!(p.invuln>0&&((world.tick>>1)&1))){
    const psx = Math.round(p.x-cam)-4, psy = Math.round(p.y);
    if(p.para){
      drawParachute(psx, psy, Math.sin(world.tick*0.12)*2);
    }
    drawMan(psx, psy, p.face,
      {snake:true, h:K.GREEN2, h2:K.GREEN1, f:K.SKIN0, f2:K.SKIN1, u:K.GREEN1, u2:K.GREEN0, belt:K.DARK, knee:K.DARK},
      {leg:p.leg, knife:p.attack>0, climb:p.climbing, prone:p.prone, hasRpg:p.pow>0, air:!p.onGround&&!p.climbing});
  }
  for(const ch of world.chutes){
    if(ch.life>16 || (ch.life&1)){
      drawParachute(Math.round(ch.x-cam)-4, Math.round(ch.y), 0);
    }
  }

  for(const pt of world.parts){
    const sx=Math.round(pt.x-cam), sy=Math.round(pt.y), r=pt.big?Math.max(2,(pt.life/3)|0):Math.max(1,(pt.life/3)|0);
    rect(sx-r,sy-r,r*2,r*2,(pt.life&2)?K.RED2:((pt.life&1)?K.GOLD1:K.WHITE));
  }
}

function drawTitle(){
  for(let y=0;y<H;y++){ const t=y/H; for(let x=0;x<W;x++) fb[y*W+x]=mix(x,y,K.TEAL0,K.BLACK,t*0.85); }
  fcText("VENOM", W/2-48, 48, K.GREEN2, 2, "center");
  fcText("BERET", W/2+52, 48, K.ORANGE, 2, "center");
  fcText("RUSH N METAL GEAR", W/2, 74, K.SKY0, 1, "center");
  drawMan(W/2-10, 84, 1,
    {snake:true, h:K.GREEN2, h2:K.GREEN1, f:K.SKIN0, f2:K.SKIN1, u:K.GREEN1, u2:K.GREEN0, belt:K.DARK, knee:K.DARK},
    {leg:1, hasRpg:true});
  if(((sceneT>>4)&1)===0) fcText("PRESS ENTER", W/2, 146, K.WHITE, 1, "center");
  text("←→ 移动  ↓ 趴下/爬梯  SPACE 跳", W/2, 176, 12, K.GRAY4, "center");
  text("J 刺刀   ↑+J 发射火箭筒(POW)", W/2, 196, 12, K.GOLD1, "center");
}
function drawGameOver(){
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) fb[y*W+x]=mix(x,y,K.BLACK,K.RED0,y/H*0.35);
  fcText("TIME OVER", W/2, 78, K.RED2, 2, "center");
  fcText("SNAKE? SNAAAAKE!", W/2, 108, K.WHITE, 1, "center");
  fcText("SCORE "+world.score, W/2, 128, K.GOLD1, 1, "center");
  if(((sceneT>>4)&1)===0) fcText("PRESS ENTER", W/2, 162, K.WHITE, 1, "center");
}
function drawClear(){
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) fb[y*W+x]=mix(x,y,K.TEAL0,K.SAGE0,y/H*0.5);
  fcText("MISSION ACCOMPLISHED", W/2, 72, K.GOLD1, 1, "center");
  fcText("ICBM DESTROYED!", W/2, 94, K.WHITE, 1, "center");
  fcText("SCORE "+world.score, W/2, 120, K.BLACK, 1, "center");
  fcText("POW RESCUED "+world.rescued+"/3", W/2, 138, K.BLACK, 1, "center");
  if(((sceneT>>4)&1)===0) fcText("PRESS ENTER", W/2, 166, K.BLACK, 1, "center");
}

/* 14. 输入 */
const keys=new Set(), pressedSet=new Set();
const KEYMAP={ArrowLeft:"left",ArrowRight:"right",KeyA:"left",KeyD:"right",
  ArrowUp:"up",ArrowDown:"down",KeyW:"up",KeyS:"down",
  Space:"jump",KeyJ:"attack",KeyZ:"attack",Enter:"start"};
const held=(n)=>keys.has(n), pressed=(n)=>pressedSet.has(n);
addEventListener("keydown",(e)=>{ const k=KEYMAP[e.code]; if(!k) return;
  e.preventDefault(); if(!keys.has(k)) pressedSet.add(k); keys.add(k); ensureAudio(); });
addEventListener("keyup",(e)=>{ const k=KEYMAP[e.code]; if(k){ e.preventDefault(); keys.delete(k); } });
addEventListener("pointerdown",()=>{ ensureAudio(); if(state!=="play") pressedSet.add("start"); });

/* 15. 主循环 */
const STEP=1000/60; let acc=0, last=performance.now();
const DEBUG=/debug/.test(location.search);
function step(){
  if(state==="title"){ sceneT++; if(pressed("start")){ resetWorld(); state="play"; sceneT=0; } }
  else if(state==="play"){ stepPlay(); }
  else { sceneT++; if(pressed("start")){ state="title"; sceneT=0; } }
  pressedSet.clear();
}
function render(){
  if(state==="title"){ drawTitle(); postFx({bright:1,flash:0,flashColor:[255,40,40],shake:0}); }
  else if(state==="gameover"){ drawGameOver(); postFx({bright:1,flash:0,flashColor:[255,40,40],shake:0}); }
  else if(state==="clear"){ drawClear(); postFx({bright:1,flash:0,flashColor:[255,40,40],shake:0}); }
  else { drawWorld(); drawHUD(); drawBanner(); if(DEBUG) fcText("T"+world.tick, 4, H-8, K.GRAY3, 1); postFx(world.fx); }
  present();
}
function loop(now){
  acc+=Math.min(now-last,250); last=now;
  let n=0; while(acc>=STEP&&n<5){ step(); acc-=STEP; n++; }
  if(n===5) acc=0;
  render(); requestAnimationFrame(loop);
}

/* 16. 启动 */
resetWorld();
requestAnimationFrame(loop);
window.__debug={ get world(){return world;}, get state(){return state;}, set state(v){state=v;}, keys:keys, pressed:pressedSet, step:step, render:render };
})();
</script>
